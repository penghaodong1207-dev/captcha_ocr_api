Global:
  use_gpu: false
  epoch_num: 50
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: D:/Pycharm/captcha_project/output/captcha_svtr_clean_finetune
  save_epoch_step: 1
  eval_batch_step:
  - 0
  - 107
  cal_metric_during_train: true
  pretrained_model: D:/Pycharm/captcha_project/pretrain_models/rec_svtr_tiny_none_ctc_en_train/best_accuracy
  checkpoints: null
  save_inference_dir: null
  use_visualdl: false
  infer_img: doc/imgs_words_en/word_10.png
  character_dict_path: D:/Pycharm/captcha_project/data_clean/captcha_dict.txt
  character_type: en
  max_text_length: 6
  infer_mode: false
  use_space_char: false
  save_res_path: D:/Pycharm/captcha_project/output/captcha_svtr_clean_predict.txt
  d2s_train_image_shape:
  - 3
  - 64
  - 256
Optimizer:
  name: AdamW
  beta1: 0.9
  beta2: 0.99
  epsilon: 1.0e-08
  weight_decay: 0.05
  no_weight_decay_name: norm pos_embed
  one_dim_param_no_weight_decay: true
  lr:
    name: Cosine
    learning_rate: 0.0001
    warmup_epoch: 2
Architecture:
  model_type: rec
  algorithm: SVTR
  Transform:
    name: STN_ON
    tps_inputsize:
    - 32
    - 64
    tps_outputsize:
    - 32
    - 100
    num_control_points: 20
    tps_margins:
    - 0.05
    - 0.05
    stn_activation: none
  Backbone:
    name: SVTRNet
    img_size:
    - 32
    - 100
    out_char_num: 25
    out_channels: 192
    patch_merging: Conv
    embed_dim:
    - 64
    - 128
    - 256
    depth:
    - 3
    - 6
    - 3
    num_heads:
    - 2
    - 4
    - 8
    mixer:
    - Local
    - Local
    - Local
    - Local
    - Local
    - Local
    - Global
    - Global
    - Global
    - Global
    - Global
    - Global
    local_mixer:
    - - 7
      - 11
    - - 7
      - 11
    - - 7
      - 11
    last_stage: true
    prenorm: false
  Neck:
    name: SequenceEncoder
    encoder_type: reshape
  Head:
    name: CTCHead
Loss:
  name: CTCLoss
PostProcess:
  name: CTCLabelDecode
Metric:
  name: RecMetric
  main_indicator: acc
Train:
  dataset:
    name: SimpleDataSet
    data_dir: D:/Pycharm/captcha_project
    label_file_list:
    - D:/Pycharm/captcha_project/data_clean/train.txt
    transforms: &id001
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - CTCLabelEncode: null
    - SVTRRecResizeImg:
        image_shape:
        - 3
        - 64
        - 256
        padding: false
    - KeepKeys:
        keep_keys:
        - image
        - label
        - length
  loader:
    shuffle: true
    batch_size_per_card: 8
    drop_last: true
    num_workers: 0
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: D:/Pycharm/captcha_project
    label_file_list:
    - D:/Pycharm/captcha_project/data_clean/val.txt
    transforms: *id001
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 8
    num_workers: 0
